name: Build desktop release installers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-v1.0.1
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress
          $wix = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.14\bin"
          if (-not (Test-Path $wix)) { throw "WiX 3.14 installation was not found at $wix" }
          Add-Content $env:GITHUB_PATH $wix
      - name: Build Windows MSI
        shell: pwsh
        run: |
          .\gradlew.bat :desktopApp:packageMsi --no-daemon
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $msi = Get-ChildItem desktopApp\build\compose\binaries\main\msi -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw "Gradle did not produce an MSI" }
          Copy-Item $msi.FullName release-assets\ASR-Studio-1.0.1-windows-x64.msi
          $installed = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "MSI installation failed with exit code $($installed.ExitCode)" }
          $exe = Get-ChildItem $env:ProgramFiles -Filter "ASR Studio.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Installed ASR Studio executable was not found" }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "ASR Studio exited during the Windows launch smoke check" }
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release-assets/ASR-Studio-1.0.1-windows-x64.msi
          if-no-files-found: error
          retention-days: 7

  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install DEB packaging prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot xvfb
      - name: Build Ubuntu DEB
        run: |
          ./gradlew :desktopApp:packageDeb --no-daemon
          mkdir -p release-assets
          deb="$(find desktopApp/build/compose/binaries/main/deb -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          cp "$deb" release-assets/ASR-Studio-1.0.1-ubuntu-24.04-x64.deb
          sudo apt-get install --yes "./release-assets/ASR-Studio-1.0.1-ubuntu-24.04-x64.deb"
          launcher="$(dpkg -L asr-studio | grep '/bin/[^/]*$' | head -n 1)"
          test -n "$launcher"
          set +e
          xvfb-run -a timeout --signal=TERM 15s "$launcher"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "ASR Studio launch failed with status $status"
            exit "$status"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-installer
          path: release-assets/ASR-Studio-1.0.1-ubuntu-24.04-x64.deb
          if-no-files-found: error
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build macOS DMG
        run: |
          ./gradlew :desktopApp:packageDmg --no-daemon
          mkdir -p release-assets
          dmg="$(find desktopApp/build/compose/binaries/main/dmg -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" release-assets/ASR-Studio-1.0.1-macos.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: release-assets/ASR-Studio-1.0.1-macos.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-ubuntu, build-macos]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: "*-installer"
          merge-multiple: true
      - name: Verify installers and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f release-assets/ASR-Studio-1.0.1-windows-x64.msi
          test -f release-assets/ASR-Studio-1.0.1-ubuntu-24.04-x64.deb
          test -f release-assets/ASR-Studio-1.0.1-macos.dmg
          sha256sum release-assets/*.msi release-assets/*.deb release-assets/*.dmg > release-assets/SHA256SUMS
          gh release create v1.0.1 \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "ASR Studio v1.0.1" \
            --notes "Cross-platform desktop release. Includes macOS DMG, Windows x64 MSI, Ubuntu 24.04 x64 DEB, and SHA-256 checksums. Installers bundle a Java runtime."
          gh release upload v1.0.1 release-assets/* --repo "$GH_REPO" --clobber
